name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: install deps
        run: |
          grep -q '^\[multilib\]' /etc/pacman.conf || printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed \
            base-devel meson ninja git vulkan-headers wayland-protocols \
            wayland libxcb libx11 vulkan-icd-loader \
            lib32-wayland lib32-libxcb lib32-libx11 lib32-vulkan-icd-loader

      - uses: actions/checkout@v4

      - name: build
        run: |
          meson setup build --prefix=/usr -Dwerror=true -Drelocatable_layer=true
          ninja -C build
          meson setup build32 --prefix=/usr --libdir=lib32 -Dwerror=true -Drelocatable_layer=true \
            --cross-file cross/i686-pc-linux-gnu.ini
          ninja -C build32

      - name: smoke check
        run: |
          for lib in build/src/libVkLayer_vknemu.so build32/src/libVkLayer_vknemu.so; do
            file "$lib"
            nm -D --defined-only "$lib" | grep vknemu_GetInstanceProcAddr
          done
